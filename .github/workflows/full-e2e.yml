name: Full browser E2E (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full browser E2E
        id: full-e2e
        run: npm run test:e2e:manual

      - name: Upload Playwright diagnostics
        if: failure() && steps.full-e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-e2e-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7
